name: Release

on:
  push:
    tags:
      - 'v4.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from .toc and validate against tag
        id: version
        run: |
          set -euo pipefail

          # .toc stores the version as 4x02, releases are tagged v4.0.2
          toc_raw="$(grep -oP '^##\s*Version:\s*\K\S+' GearScoreLite/GearScoreLite.toc)"
          if [[ ! "$toc_raw" =~ ^([0-9]+)x([0-9]{2})$ ]]; then
            echo "::error::Unexpected version format in .toc: '$toc_raw' (expected e.g. 4x02)"
            exit 1
          fi
          toc_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]:0:1}.${BASH_REMATCH[2]:1:1}"

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$toc_version" != "$tag_version" ]]; then
            echo "::error::Version mismatch: .toc says $toc_raw ($toc_version), tag says $GITHUB_REF_NAME ($tag_version). Bump the .toc before tagging."
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "toc_version=$toc_raw" >> "$GITHUB_OUTPUT"
          echo "Building version $tag_version"

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          src="RELEASE_NOTES_${{ steps.version.outputs.toc_version }}.md"
          if [[ -f "$src" ]]; then
            python3 .github/scripts/clean_release_notes.py "$src" > release_body.md
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "Using $src:"
            cat release_body.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$src not found, falling back to generated notes"
          fi

      - name: Stage addon files
        run: |
          set -euo pipefail
          mkdir -p build/GearScoreLite
          for f in CHANGELOG.md FiraSans-SemiBold.ttf GearScoreLite.lua GearScoreLite.toc informationLite.lua; do
            cp "GearScoreLite/$f" "build/GearScoreLite/$f"
          done
          ls -l build/GearScoreLite

      - name: Create archive
        id: archive
        run: |
          set -euo pipefail
          name="GearScoreLite - Reborn - v${{ steps.version.outputs.version }}.zip"
          (cd build && zip -r -X "../$name" GearScoreLite)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          unzip -l "$name"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "GearScoreLite: Reborn v${{ steps.version.outputs.version }}"
          files: ${{ steps.archive.outputs.name }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'release_body.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          fail_on_unmatched_files: true
