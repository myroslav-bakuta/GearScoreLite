name: Release

on:
  push:
    tags:
      - 'v4.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The release body is the tagged commit's message, so the commit
          # itself has to be fetched rather than just the tree.
          fetch-depth: 0

      - name: Read version from .toc and validate against tag
        id: version
        run: |
          set -euo pipefail

          # .toc stores the version as 4x02, releases are tagged v4.0.2
          toc_raw="$(grep -oP '^##\s*Version:\s*\K\S+' GearScoreLite/GearScoreLite.toc)"
          if [[ ! "$toc_raw" =~ ^([0-9]+)x([0-9]{2})$ ]]; then
            echo "::error::Unexpected version format in .toc: '$toc_raw' (expected e.g. 4x02)"
            exit 1
          fi
          toc_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]:0:1}.${BASH_REMATCH[2]:1:1}"

          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$toc_version" != "$tag_version" ]]; then
            echo "::error::Version mismatch: .toc says $toc_raw ($toc_version), tag says $GITHUB_REF_NAME ($tag_version). Bump the .toc before tagging."
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "toc_version=$toc_raw" >> "$GITHUB_OUTPUT"
          echo "Building version $tag_version"

      - name: Prepare release notes
        run: |
          set -euo pipefail
          # The release body is the message of the commit the tag points at. An
          # annotated tag's own message is used in preference when it has one.
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release_body.md
          if [[ ! -s release_body.md ]]; then
            git log -1 --format='%B' "$GITHUB_REF_NAME" > release_body.md
          fi
          cat release_body.md

      - name: Stage addon files
        run: |
          set -euo pipefail
          mkdir -p build/GearScoreLite
          for f in FiraSans-SemiBold.ttf GearScoreLite.lua GearScoreLite.toc informationLite.lua; do
            cp "GearScoreLite/$f" "build/GearScoreLite/$f"
          done
          ls -l build/GearScoreLite

      - name: Create archive
        id: archive
        run: |
          set -euo pipefail
          name="GearScoreLite - Reborn - v${{ steps.version.outputs.version }}.zip"
          (cd build && zip -r -X "../$name" GearScoreLite)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          unzip -l "$name"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "GearScoreLite: Reborn v${{ steps.version.outputs.version }}"
          files: ${{ steps.archive.outputs.name }}
          body_path: release_body.md
          fail_on_unmatched_files: true
